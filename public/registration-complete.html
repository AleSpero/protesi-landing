<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Registrazione completata · ProteSì</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --dark: #1a2960;
      --blue: #3571c4;
      --orange: #ee6c16;
      --orange-strong: #d95f0e;
      --green: #008a5e;
      --grey: #777676;
      --divider: #d7ddea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(
        to top right,
        #1a2960 0%,
        #1b2b63 50%,
        #2e5da9 80%,
        #3571c4 100%
      );
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px 36px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(10, 20, 60, 0.25);
    }

    .wordmark {
      font-size: 26px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }
    .wordmark .accent { color: var(--orange); }

    .badge {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(0, 138, 94, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge svg { width: 44px; height: 44px; }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.55;
      color: var(--grey);
      margin-bottom: 8px;
    }

    .button {
      display: block;
      margin-top: 24px;
      padding: 16px 24px;
      border-radius: 14px;
      background: var(--orange);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s;
    }
    .button:hover { background: var(--orange-strong); }
    .button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

    .hint {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--divider);
      font-size: 13px;
      color: var(--grey);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="wordmark">Prote<span class="accent">S&igrave;</span></div>

    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M4 12.5l5 5L20 6.5"
          stroke="#008A5E"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <h1>Registrazione completata!</h1>
    <p>
      Il tuo indirizzo email &egrave; stato verificato con successo e il tuo
      account &egrave; ora attivo.
    </p>
    <p>
      Torna all&rsquo;app <strong>ProteS&igrave;</strong> e accedi con le tue
      credenziali.
    </p>

    <!-- Same destination as every "Accedi" on the landings (src/lib/app-links.ts). -->
    <a class="button" href="https://app.protesi.io/#/login">Accedi a ProteS&igrave;</a>

    <div class="hint">
      Puoi chiudere questa pagina in sicurezza.
    </div>
  </main>
</body>
</html>
